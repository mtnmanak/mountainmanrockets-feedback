# .github/ISSUE_TEMPLATE/bug-report.yml
name: Bug report
description: Something is broken, looks wrong, or is out of date
# "bug" is the DEFAULT, not the verdict. The kind dropdown below can swap it for
# design or content via .github/workflows/apply-tool-label.yml. It is declared here
# rather than left to the workflow so that an issue is never label-less if the
# workflow is disabled or fails — the common case stays correct with no automation.
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Where did this happen?
      options:
        - MMRocket Sim
        - Motor Dashboard
        - Motor Simulator
        - Black Powder Calculator
        - The mountainmanrockets.com website itself
        - Something else / not sure
    validations:
      required: true
  # ⚠️ These option strings are matched BYTE FOR BYTE by apply-tool-label.yml.
  # Deliberately plain ASCII — no em dashes, no curly quotes. A mismatch fails
  # silently: the workflow runs green and simply applies no label.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      description: "\"Broken\" and \"looks wrong\" are different jobs, so they get different labels."
      options:
        - Something is broken or does not work
        - It looks wrong (spacing, layout, a bad crop)
        - The words, photos or data are wrong or out of date
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? A screenshot helps if it's visual.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version (if shown)
      description: "Online OpenRocket shows it next to the logo, e.g. v0.042 beta."
  - type: input
    id: browser
    attributes:
      label: Browser & device
      placeholder: "Chrome on Windows 11 / Safari on iPhone 15"
  - type: textarea
    id: design
    attributes:
      label: Design file (optional)
      description: For simulator issues, attaching the .ork/.rkt file (zip it first) makes the fix much faster. Only attach designs you're comfortable sharing publicly.
